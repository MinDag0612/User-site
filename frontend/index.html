<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Site</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      color: #111;
      background: #f4f6fb;
    }
    .card {
      max-width: 420px;
      margin: 0 auto;
      padding: 24px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 14px 30px rgba(32, 41, 56, 0.12);
    }
    h1 {
      margin: 0 0 16px;
      font-size: 24px;
    }
    button {
      width: 100%;
      padding: 12px 14px;
      font-size: 15px;
      border-radius: 8px;
      border: none;
      background: #0f766e;
      color: white;
      cursor: pointer;
      font-weight: 700;
    }
    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    #output {
      margin-top: 18px;
      padding: 14px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      min-height: 48px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>User Site</h1>
    <button id="callApiButton" type="button">Call API</button>
    <div id="output">Nhấn nút để gọi backend.</div>
  </div>

  <script>
    const callApiButton = document.getElementById('callApiButton');
    const output = document.getElementById('output');

    callApiButton.addEventListener('click', async () => {
      callApiButton.disabled = true;
      output.textContent = 'Đang gọi API...';

      try {
        const response = await fetch('/api/hello');
        const data = await response.json();
        output.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        output.textContent = `Lỗi: ${error.message}`;
      } finally {
        callApiButton.disabled = false;
      }
    });
  </script>
</body>
</html>
