services:

  backend:
    build: ./backend
    container_name: user_backend
    restart: unless-stopped
    ports:
      - "8080:8000"

  frontend:
    build: ./frontend
    container_name: user_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "82:80"

  image-manager:
    image: dangwminh/image-manager:latest
    container_name: image_manager
    restart: "no"
    volumes:
      - ./sandbox:/app/sandbox
      - ./.machine_id:/app/.machine_id